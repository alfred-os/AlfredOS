# config/routing.yaml — AlfredOS provider routing configuration.
#
# This file configures the privileged and quarantined LLM providers.
# The [quarantine] block is gated: changes to 'provider' and 'secret_id'
# go through the state.git reviewer-gate (high-blast, spec §11.1).
# See docs/runbooks/slice-3-quarantined-llm.md for the proposal walkthrough
# (the previous 'alfred config quarantined-provider' CLI was vapourware —
# devex-001 fix; the runbook documents the actual state.git flow).
#
# Downstream consumer: QuarantinedExtractor (PR-S3-4) reads
# routing.yaml[quarantine] at construction; the manifest's declared
# provider must match or the plugin receives plugin.load_refused at handshake
# (spec §5.4, index plan §3 cross-PR contract).

# Primary (privileged) provider — NOT configured here, and NOT in config/alfred.toml
# either (nothing loads that file; its [provider] block is inert). The runtime source
# of truth is the ALFRED_PRIMARY_PROVIDER .env setting (Settings.primary_provider,
# a Literal["anthropic", "deepseek"], default "deepseek"). Even that is read only by
# `alfred status` and the opt-in separation check below — build_router still hardcodes
# DeepSeek as privileged (ADR-0064; #590 tracks closing that gap).

quarantine:
  # Provider for the quarantined LLM. NOTE (#587): this routing.yaml value is NOT
  # read at runtime — no loader exists yet ("slice 4+"). The actual runtime source
  # of truth is the ALFRED_QUARANTINE_PROVIDER .env setting (Settings.quarantine_provider,
  # default "anthropic"). This field stays here as the alfred-config-proposal target
  # (the state.git reviewer-gate flow, docs/runbooks/slice-3-quarantined-llm.md) and
  # as documentation of the shipped default, but changing it alone does nothing.
  #
  # Provider-separation enforcement (ADR-0064 — see Step 0 of this task; no PRD
  # section states this invariant, do not re-cite "spec §5.4 / PRD §6.4") is
  # OPT-IN (#586): set ALFRED_REQUIRE_QUARANTINE_PROVIDER_SEPARATION=true to
  # refuse boot on a same-provider collision. Default: permitted, with a warning.
  provider: "anthropic"

  # Model identifier for the quarantined LLM.
  # Haiku is the default: fast, cheap, adequate for structured extraction.
  model: "claude-haiku-4-5"

  # Secret broker ID for the quarantined provider API key.
  # The SecretBroker resolves this before subprocess spawn via fd-3 handshake
  # (spec §5.3). The literal API key never appears here.
  secret_id: "quarantine_provider_api_key"

  # Per-extraction max-token budget (AI-2 fix). Caps the total tokens
  # the quarantined LLM may emit for a single quarantine.extract call;
  # exceeding this cap raises TypedRefusal(reason="provider_refused")
  # so audit consumers see an explicit budget breach rather than a
  # silent provider-side truncation. 8192 is the conservative default
  # — structured-extraction schemas in Slice 3 are small JSON objects.
  # Per-day / per-user quotas are deferred to Slice 4 (the quota
  # subsystem lands alongside cost-report wiring).
  max_tokens_per_extraction: 8192
