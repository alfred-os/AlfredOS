name: PR Python validation

# Standalone PR validation that runs the Python quality bar (format,
# lint, type-check, tests) and gates the merge button on each. Authored
# per .rulesync/skills/author-gating-workflow/SKILL.md.
#
# Each gate is a separate job so it surfaces as its own checkbox in the
# PR checks panel and can be promoted to a required status individually.
#
# Each job's first step is a srccheck guard. It is FAIL-CLOSED (#514): src/
# and tests/ are permanent, so a probe finding nothing means the PROBE broke
# and the job exits 1. It previously short-circuited with SUCCESS, which is
# exactly how six jobs — including the required tag(T3) and i18n gates —
# reported green while executing nothing for about a month.
#
# Convention reference: docs/python-conventions.md.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# Shared environment: pin uv and Python version once so all jobs agree.
env:
  PYTHON_VERSION: "3.14"
  # Pinned to match the WSL leg (ci.yml, which already used 0.11.32) and the repo
  # `.prototools` pin, so local and CI resolve with the SAME uv. Was 0.5.14 — roughly a
  # year behind, in the tool that owns lockfile resolution and env creation.
  UV_VERSION: "0.11.32"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: ruff format --check
  # Enforces the formatter is a no-op (i.e. the author ran it).
  # ─────────────────────────────────────────────────────────────
  ruff-format:
    name: Ruff format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check for Python source files
        id: srccheck
        run: |
          set -euo pipefail
          # #514: probe via `find … -print -quit` — NEVER `find … | grep -q`, whose
          # early-exiting reader SIGPIPEs `find` (status 141) under `pipefail`, so the
          # probe false-negatives once the tree grows past a few hundred entries and the
          # gate silently skips while reporting success. Pinned by
          # tests/unit/test_workflow_invariants.py.
          has_src=false
          has_tests=false
          if [ -n "$(find src -name '*.py' -print -quit 2>/dev/null)" ]; then has_src=true; fi
          if [ -n "$(find tests -name '*.py' -print -quit 2>/dev/null)" ]; then has_tests=true; fi
          if [ "$has_src" = "true" ] || [ "$has_tests" = "true" ]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            # FAIL-CLOSED (#514, mirroring adversarial.yml): this path is permanent, so
            # "nothing found" means the PROBE broke, not that there is nothing to check.
            # Skipping here would pass a required check while gating nothing.
            echo "::error::Python source probe found nothing — required gate cannot run"
            exit 1
          fi
      - name: Install uv
        if: steps.srccheck.outputs.has_source == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          # Cache `~/.cache/uv` keyed on the lock file so the 5 jobs share
          # the resolver result across the matrix instead of each re-resolving
          # + re-downloading dev deps on every PR push.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        if: steps.srccheck.outputs.has_source == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync dependencies
        if: steps.srccheck.outputs.has_source == 'true'
        run: uv sync --dev
      - name: Run ruff format --check
        if: steps.srccheck.outputs.has_source == 'true'
        run: |
          targets=()
          [ -d src ] && targets+=(src)
          [ -d tests ] && targets+=(tests)
          uv run ruff format --check "${targets[@]}"

  # ─────────────────────────────────────────────────────────────
  # Job 2: ruff check (lint)
  # ─────────────────────────────────────────────────────────────
  ruff-lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check for Python source files
        id: srccheck
        run: |
          set -euo pipefail
          # #514: probe via `find … -print -quit` — NEVER `find … | grep -q`, whose
          # early-exiting reader SIGPIPEs `find` (status 141) under `pipefail`, so the
          # probe false-negatives once the tree grows past a few hundred entries and the
          # gate silently skips while reporting success. Pinned by
          # tests/unit/test_workflow_invariants.py.
          has_src=false
          has_tests=false
          if [ -n "$(find src -name '*.py' -print -quit 2>/dev/null)" ]; then has_src=true; fi
          if [ -n "$(find tests -name '*.py' -print -quit 2>/dev/null)" ]; then has_tests=true; fi
          if [ "$has_src" = "true" ] || [ "$has_tests" = "true" ]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            # FAIL-CLOSED (#514, mirroring adversarial.yml): this path is permanent, so
            # "nothing found" means the PROBE broke, not that there is nothing to check.
            # Skipping here would pass a required check while gating nothing.
            echo "::error::Python source probe found nothing — required gate cannot run"
            exit 1
          fi
      - name: Install uv
        if: steps.srccheck.outputs.has_source == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          # Cache `~/.cache/uv` keyed on the lock file so the 5 jobs share
          # the resolver result across the matrix instead of each re-resolving
          # + re-downloading dev deps on every PR push.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        if: steps.srccheck.outputs.has_source == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync dependencies
        if: steps.srccheck.outputs.has_source == 'true'
        run: uv sync --dev
      - name: Run ruff check
        if: steps.srccheck.outputs.has_source == 'true'
        run: |
          targets=()
          [ -d src ] && targets+=(src)
          [ -d tests ] && targets+=(tests)
          uv run ruff check "${targets[@]}"

  # ─────────────────────────────────────────────────────────────
  # Job 3: mypy strict
  # Primary type-checker.
  # ─────────────────────────────────────────────────────────────
  mypy:
    name: Mypy (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check for Python source files
        id: srccheck
        run: |
          set -euo pipefail
          # Probe src/ defensively: under `set -euo pipefail` a missing src/
          # would otherwise abort the guard before the else-branch.
          # #514: probe via `find … -print -quit` — NEVER `find … | grep -q`, whose
          # early-exiting reader SIGPIPEs `find` (status 141) under `pipefail`, so the
          # probe false-negatives once the tree grows past a few hundred entries and the
          # gate silently skips while reporting success. Pinned by
          # tests/unit/test_workflow_invariants.py.
          if [ -n "$(find src -name '*.py' -print -quit 2>/dev/null)" ]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            # FAIL-CLOSED (#514, mirroring adversarial.yml): this path is permanent, so
            # "nothing found" means the PROBE broke, not that there is nothing to check.
            # Skipping here would pass a required check while gating nothing.
            echo "::error::Python source probe found nothing — required gate cannot run"
            exit 1
          fi
      - name: Install uv
        if: steps.srccheck.outputs.has_source == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          # Cache `~/.cache/uv` keyed on the lock file so the 5 jobs share
          # the resolver result across the matrix instead of each re-resolving
          # + re-downloading dev deps on every PR push.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        if: steps.srccheck.outputs.has_source == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync dependencies
        if: steps.srccheck.outputs.has_source == 'true'
        run: uv sync --dev
      - name: Run mypy --strict
        if: steps.srccheck.outputs.has_source == 'true'
        run: uv run mypy --strict src scripts/check_tag_t3.py

  # ─────────────────────────────────────────────────────────────
  # Job 4: pyright
  # Secondary type-checker; catches what mypy misses.
  # ─────────────────────────────────────────────────────────────
  pyright:
    name: Pyright
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check for Python source files
        id: srccheck
        run: |
          set -euo pipefail
          # Probe src/ defensively: under `set -euo pipefail` a missing src/
          # would otherwise abort the guard before the else-branch.
          # #514: probe via `find … -print -quit` — NEVER `find … | grep -q`, whose
          # early-exiting reader SIGPIPEs `find` (status 141) under `pipefail`, so the
          # probe false-negatives once the tree grows past a few hundred entries and the
          # gate silently skips while reporting success. Pinned by
          # tests/unit/test_workflow_invariants.py.
          if [ -n "$(find src -name '*.py' -print -quit 2>/dev/null)" ]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            # FAIL-CLOSED (#514, mirroring adversarial.yml): this path is permanent, so
            # "nothing found" means the PROBE broke, not that there is nothing to check.
            # Skipping here would pass a required check while gating nothing.
            echo "::error::Python source probe found nothing — required gate cannot run"
            exit 1
          fi
      - name: Install uv
        if: steps.srccheck.outputs.has_source == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          # Cache `~/.cache/uv` keyed on the lock file so the 5 jobs share
          # the resolver result across the matrix instead of each re-resolving
          # + re-downloading dev deps on every PR push.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        if: steps.srccheck.outputs.has_source == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync dependencies
        if: steps.srccheck.outputs.has_source == 'true'
        run: uv sync --dev
      - name: Run pyright
        if: steps.srccheck.outputs.has_source == 'true'
        run: uv run pyright src scripts/check_tag_t3.py

  # The previous "Pytest" job here ran `pytest tests/unit tests/integration
  # -q` WITHOUT coverage. It showed engineers a green "Pytest" check on
  # every PR while the real coverage gates (in ci.yml's `Python (lint,
  # types, unit)`, `Integration`, and `coverage-gates` jobs) had been
  # paper-only for months — first because ci.yml failed to parse for 500+
  # attempts (PR #183 fixed), then because individual paper-only gates
  # cascaded (#194/#195/#196/#198 + the coverage-combine bug #200). The
  # misleading parallel green signal let coverage debt accumulate quietly.
  #
  # Removed in #201. ci.yml's `Python (lint, types, unit)` is the
  # canonical Python-test gate; it runs the same suite WITH per-subsystem
  # 100% coverage gates and is promoted to required alongside this change.

  # -----------------------------------------------------------------
  # Job 6: tag(T3, ...) grep gate (Slice-3 spec §3.7-3.8)
  # CLAUDE.md hard rule (security #3 + #5): the privileged orchestrator
  # never sees raw T3 content; tagging is the boundary primitive. The
  # grep gate is release-blocking — only `security/tiers.py` may call
  # `tag(T3, ...)` (SINGULAR since #538 deleted the second whole-file
  # exemption), and `cast(TaggedContent[...]` is a type-erasure bypass
  # that discards provenance.
  # `scripts/check_tag_t3.py` is the AST-based implementation; this job
  # wires it into CI as a standalone gating check so it can be promoted
  # to a required status independently of the other Python jobs.
  # -----------------------------------------------------------------
  tag-t3-grep:
    name: tag(T3) grep gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check for Python source files
        id: srccheck
        run: |
          set -euo pipefail
          # Same guard pattern as the other Python jobs: pre-Slice-3 main
          # may have no src/alfred/, in which case the gate is a no-op.
          # The script is stdlib-only so no uv/python provisioning is
          # needed when src/ is absent.
          # #514: probe via `find … -print -quit` — NEVER `find … | grep -q`, whose
          # early-exiting reader SIGPIPEs `find` (status 141) under `pipefail`, so the
          # probe false-negatives once the tree grows past a few hundred entries and the
          # gate silently skips while reporting success. Pinned by
          # tests/unit/test_workflow_invariants.py.
          if [ -n "$(find src/alfred -name '*.py' -print -quit 2>/dev/null)" ]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            # FAIL-CLOSED (#514, mirroring adversarial.yml): this path is permanent, so
            # "nothing found" means the PROBE broke, not that there is nothing to check.
            # Skipping here would pass a required check while gating nothing.
            echo "::error::Python source probe found nothing — required gate cannot run"
            exit 1
          fi
      - name: Set up Python
        if: steps.srccheck.outputs.has_source == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run check_tag_t3.py over its own declared scan roots
        if: steps.srccheck.outputs.has_source == 'true'
        # stdlib-only script; no uv sync required. Releases-blocking per
        # spec §3.7-3.8 — only `security/tiers.py` may call
        # `tag(T3, ...)` (SINGULAR since #538 deleted the second
        # whole-file exemption), and `cast(TaggedContent[...]` is a
        # type-erasure bypass that discards provenance. The script exits 1
        # with violation messages on any non-approved file containing
        # those patterns.
        #
        # #541: the scan roots live in the script (`_DEFAULT_SCAN_ROOTS`), NOT
        # here — passing them on the command line meant dropping one was a
        # one-word edit no gate could see, and it silently stopped gating 39
        # first-party plugin files.
        run: python3 scripts/check_tag_t3.py

  # -----------------------------------------------------------------
  # Job 6b: strict_declarations lint (#119 SEC-Med-1)
  # `HookRegistry(strict_declarations=False)` disables BOTH halves of the
  # register-time + dispatch-time enforcement, so a subscriber whose tier is
  # not in the publisher-declared `subscribable_tiers` registers cleanly and
  # runs at dispatch. `scripts/check_strict_declarations.py` is the grep-based
  # implementation.
  #
  # This job exists because the guard was enforced NOWHERE (#543 follow-up):
  # its docstring claimed "CI runs `make check`", but no workflow runs `make
  # check` and no workflow referenced the script — verified by grepping the
  # script name (not the ambiguous bare word `strict`, which also matches the
  # `mypy --strict` lines in lefthook.yml). It fired only when a developer
  # chose to type `make check` locally. A required-looking guard that no CI
  # job executes is the paper-gate shape #245/#514 exist to prevent.
  #
  # This is a literal copy of the `tag-t3-grep` job above with only the job
  # id, `name:` and final `run:` line changed — ONE deliberate divergence:
  # the source probe below scans `src` (matching the script's own
  # `repo_root / "src"` scan root), not `src/alfred` as `tag-t3-grep` does.
  # `check_strict_declarations.py` is not scoped to `src/alfred` the way
  # `check_tag_t3.py`'s `_DEFAULT_SCAN_ROOTS` is — it scans the whole of
  # `src/`, so the presence probe has to match.
  #
  # #548 review asked for the probe to be extracted into a shared script or
  # composite action, on the reasoning that two copies of a fail-closed
  # security probe drift independently. DECLINED, because the drift it names is
  # already gated — and the shape is SEVEN copies in this file, not two, plus
  # more in ci.yml/nightly.yml, so it is a repo-wide idiom rather than a
  # two-site duplication. Both properties are pinned by DERIVED, default-deny
  # invariants in `tests/unit/test_workflow_invariants.py` that enumerate no
  # file list and no job list:
  #
  #   * `test_no_pipe_into_an_early_exit_reader` — over every shell file. A
  #     copy regressed to the #514 `find … | grep -q` SIGPIPE shape reds,
  #     naming file and line. Measured on this job's probe.
  #   * `test_presence_probes_fail_closed` — over every `has_*` probe in every
  #     workflow. A copy that lost its `exit 1` reds, naming job and step.
  #     Measured on this job's probe.
  #
  # What a stale copy CAN carry is stale PROSE, which is documentation, not the
  # gate. Against that, a composite action puts an indirection layer plus its
  # own `outputs:` plumbing between a required check and its fail-closed
  # behaviour — new machinery in the one place where "the gate could not run"
  # must stay legible. Revisit if the invariants above are ever weakened to a
  # curated list.
  # -----------------------------------------------------------------
  strict-declarations-lint:
    name: strict_declarations lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check for Python source files
        id: srccheck
        run: |
          set -euo pipefail
          # #514: probe via `find … -print -quit` — NEVER `find … | grep -q`, whose
          # early-exiting reader SIGPIPEs `find` (status 141) under `pipefail`, so the
          # probe false-negatives once the tree grows past a few hundred entries and the
          # gate silently skips while reporting success. Pinned by
          # tests/unit/test_workflow_invariants.py.
          if [ -n "$(find src -name '*.py' -print -quit 2>/dev/null)" ]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            # FAIL-CLOSED (#514, mirroring adversarial.yml): this path is permanent, so
            # "nothing found" means the PROBE broke, not that there is nothing to check.
            # Skipping here would pass a required check while gating nothing.
            echo "::error::Python source probe found nothing — required gate cannot run"
            exit 1
          fi
      - name: Set up Python
        if: steps.srccheck.outputs.has_source == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run check_strict_declarations.py over src/
        if: steps.srccheck.outputs.has_source == 'true'
        # stdlib-only script; no uv sync required. #119 SEC-Med-1 — exits 1 on
        # any `strict_declarations=False` (or spaced) occurrence in src/, with
        # violation messages, and fails closed if grep itself errors.
        run: python3 scripts/check_strict_declarations.py

  # -----------------------------------------------------------------
  # Job 7: i18n catalog drift
  # CLAUDE.md hard rule (i18n #4). NOTE two inaccuracies in that rule's wording:
  # there is no `.pre-commit-config.yaml` in this repo (lefthook is pre-push and
  # runs no pybabel), and `pybabel compile --check` is not a real flag — `--check`
  # belongs to `pybabel update`. This job is therefore the ONLY enforcement of
  # rule #4 anywhere, which is why #514 (it silently never ran) mattered.
  # Splitting into its own gating job lets it be promoted to a required
  # status independently of the other Python jobs.
  # -----------------------------------------------------------------
  i18n-catalog:
    name: i18n catalog drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check for Python source files
        id: srccheck
        run: |
          set -euo pipefail
          # Same guard pattern as the other Python jobs: pre-Slice-1 main has
          # no src/, so the catalog check is a no-op until Slice 1 lands.
          # #514: probe via `find … -print -quit` — NEVER `find … | grep -q`, whose
          # early-exiting reader SIGPIPEs `find` (status 141) under `pipefail`, so the
          # probe false-negatives once the tree grows past a few hundred entries and the
          # gate silently skips while reporting success. Pinned by
          # tests/unit/test_workflow_invariants.py.
          if [ -n "$(find src -name '*.py' -print -quit 2>/dev/null)" ]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            # FAIL-CLOSED (#514, mirroring adversarial.yml): this path is permanent, so
            # "nothing found" means the PROBE broke, not that there is nothing to check.
            # Skipping here would pass a required check while gating nothing.
            echo "::error::Python source probe found nothing — required gate cannot run"
            exit 1
          fi
      - name: Install uv
        if: steps.srccheck.outputs.has_source == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        if: steps.srccheck.outputs.has_source == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync dependencies
        if: steps.srccheck.outputs.has_source == 'true'
        run: uv sync --dev
      - name: Extract + check + compile
        if: steps.srccheck.outputs.has_source == 'true'
        # Three steps, in order:
        #   1. Extract to /tmp (never pollute the working tree — only real
        #      msgid drift should fail the gate, not the pot-creation-date
        #      artefact of the check itself).
        #   2. `pybabel update --check` exits non-zero on drift WITHOUT
        #      mutating the catalog. --ignore-pot-creation-date is critical:
        #      every extract embeds the current timestamp in the .pot, and
        #      that timestamp would otherwise propagate into the .po every
        #      run and produce eternal drift. --no-fuzzy-matching keeps a
        #      renamed string surfaced as drift rather than auto-mapped to a
        #      similar old translation.
        #   3. Compile so the CI log shows translation-coverage stats per
        #      locale (and so .mo files would be generated if we publish).
        run: |
          uv run pybabel extract -F babel.cfg -o /tmp/alfred.pot src/alfred plugins
          if ! uv run pybabel update --check -i /tmp/alfred.pot -d locale -D alfred --no-fuzzy-matching --ignore-pot-creation-date; then
            echo "::error::i18n catalog drift detected. Run 'uv run pybabel extract -F babel.cfg -o /tmp/alfred.pot src/alfred plugins && uv run pybabel update -i /tmp/alfred.pot -d locale -D alfred --no-fuzzy-matching' locally and commit the diff."
            exit 1
          fi
