# Babel extraction mapping. The path pattern is glob-matched RELATIVE to
# EACH input dir passed to `pybabel extract` (so a pattern of
# `src/alfred/**.py` would only match `src/alfred/src/alfred/**.py` —
# silently zero hits — when invoked as `pybabel extract -F babel.cfg
# src/alfred`). Use `**.py` so the pattern works no matter which root is
# being walked. Every real invocation (Makefile:129, Makefile:137, and the
# CI drift gate at .github/workflows/pr-validate-python.yml:523) runs
# `pybabel extract -F babel.cfg src/alfred plugins` — two roots, walked
# separately — never a bare `.`; see the `[ignore: **/tests/**.py]` note
# below for why that two-roots distinction matters to this mapping's own
# pattern.
#
# `keywords = t` registers AlfredOS's t() translator helper (alfred.i18n.t)
# as a gettext-like callable so its first arg is extracted as a msgid. The
# default gettext / _ keywords are NOT inherited when `keywords =` is set in
# a Babel mapping section — they're additive to the global -k flag chain.
# CI passes -k t in addition, so this default is belt-and-braces.
#
# Excluded BEFORE the catch-all below: plugin test directories. A `t()`-shaped
# call in a test file is not a production call site, and letting `pybabel
# extract` pick it up would (a) churn `#:` source-location comments in
# `locale/en/LC_MESSAGES/alfred.po` every time an unrelated test changes, and
# (b) risk masking a genuinely-dead msgid whose only remaining reference is a
# test — defeating the i18n dead-key gate. Mapping order matters: Babel
# applies the FIRST matching section, so `ignore` must precede `python: **.py`.
# The leading `**/` (rather than a literal `plugins/` prefix) is deliberate,
# per the portability note above: today's actual invocation
# (`pybabel extract -F babel.cfg src/alfred plugins`, Makefile + CI) walks
# `plugins` as ITS OWN root, so a matched path looks like
# `alfred_tui/tests/foo.py` with no `plugins/` prefix at all — a literal
# `plugins/*/tests/**.py` pattern silently matches nothing under that
# invocation. `**/tests/**.py` matches regardless of how many leading path
# segments precede `tests/` (zero, when `plugins` is the root; one, when `.`
# is the root), so it works under both invocation styles.
[ignore: **/tests/**.py]

[python: **.py]
encoding = utf-8
keywords = t
